seed_everything: true
per_run_seed: true
tags:
  exp: &exp pixeldit2_h16_in512_lora
torch_hub_dir: null
huggingface_cache_dir: null
auto_resume: false
trainer:
  default_root_dir: ./train_logs/
  accelerator: gpu
  strategy: ddp
  devices: 8
  num_nodes: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
  logger:
      class_path: lightning.pytorch.loggers.WandbLogger
      init_args:
        project: pix_dit_c2i
        name: *exp
  num_sanity_val_steps: 0
  max_steps: 20000
  val_check_interval: 2000
  check_val_every_n_epoch: null
  log_every_n_steps: 20
  deterministic: null
  inference_mode: true
  use_distributed_sampler: false
  callbacks:
    - class_path: src.utils.CheckpointHook
      init_args:
        every_n_train_steps: 5000
        save_top_k: -1
        save_last: true
    - class_path: pixdit_core.lora.LoRAAdapterCheckpoint
      init_args:
        every_n_train_steps: 1000
        save_dir: lora_adapters
        save_last: true
        save_dtype: bf16
    - class_path: src.utils.SaveImagesHook
      init_args:
         save_dir: val_512_h16_lora
         save_compressed: false
model:
  enable_profiling: false
  profiling_print_freq: 1000
  profiling_warmup_steps: 100
  override_lr_on_resume: null
  override_ema_decay_on_resume: null
  num_classes: 1000
  lr_scheduler_interval: step
  denoiser:
    class_path: pixdit_core.pixeldit2_c2i.PixelDiT2
    init_args:
        in_channels: 3
        patch_size: 16
        hidden_size: &hidden_dim 1280
        num_heads: 16
        depth: 32
        num_classes: 1000
        in_context_len: 32
        in_context_start: 8
        attn_dropout: 0.0
        proj_dropout: 0.2
        mlp_hidden_multiple: 32
        grounding_encoder: dinov3_vitb16
        grounding_proj_blocks: 1
        grounding_proj_heads: 16
        single_silu_cond: true
        pretrained_checkpoint: pixeldit2_h16_in512_ep680.ckpt
        pretrained_weights: ema
        lora_rank: 16
        lora_alpha: 16.0
        lora_dropout: 0.0
        lora_target_modules:
          - patch_blocks.*.attn.qkv
          - patch_blocks.*.attn.proj
          - patch_blocks.*.mlp.w1
          - patch_blocks.*.mlp.w2
          - patch_blocks.*.mlp.w3
        lora_exclude_modules: null
        lora_adapter_path: null
  diffusion_trainer:
    class_path: src.lora_diffusion.LoRAGroundedFlowTrainer
    init_args:
      p_mean: -0.8
      p_std: 0.8
      noise_scale: 2.0
      t_eps: 0.05
      null_condition_p: 0.1
      grounding_drop_mode: independent
      grounding_drop_p: 0.1
      grounding_joint_drop_p: 0.05
      repa_weight: 0.0
      repa_align_layer: 8
      repa_encoder: null
      proj_denoiser_dim: *hidden_dim
      proj_hidden_dim: *hidden_dim
      proj_encoder_dim: 768
  diffusion_sampler:
    class_path: src.grounded_diffusion.GroundedHeunSampler
    init_args:
      num_steps: 50
      guidance: 2.1
      guidance_interval_min: 0.1
      guidance_interval_max: 0.925
      noise_scale: 2.0
      t_eps: 0.05
  ema_tracker:
    class_path: src.utils.SimpleEMA
    init_args:
      decay: 0.9999
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1e-4
      betas:
        - 0.9
        - 0.95
      weight_decay: 0.0
  lr_scheduler:
    class_path: torch.optim.lr_scheduler.LinearLR
    init_args:
      start_factor: 0.01
      end_factor: 1.0
      total_iters: 500
data:
  train_dataset:
    class_path: src.data.ImageFolderDataset
    init_args:
      data_dir: ./imagenet512_data
      image_size: 512
      random_flip: true
  eval_dataset:
    class_path: src.data.ClassLabelRandomNDataset
    init_args:
      num_classes: 1000
      max_num_instances: 50000
      latent_shape:
        - 3
        - 512
        - 512
  pred_dataset:
    class_path: src.data.ClassLabelRandomNDataset
    init_args:
      num_classes: 1000
      max_num_instances: 50000
      latent_shape:
        - 3
        - 512
        - 512
  train_batch_size: 8
  train_num_workers: 4
  pred_batch_size: 8
  pred_num_workers: 1
